name: bookbound
icon: resources/images/logo.png
processes:
  Scheduler:
    command: php artisan schedule:work
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Pail:
    command: php artisan pail -vv
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Horizon:
    command: php artisan horizon:listen
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  lint:check:
    command: pnpm run lint:check
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Update:
    command: composer update; pnpm update
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  PNPM Dev:
    command: pnpm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
